# Standalone Phase 2 standby edge; start with -p /absolute/standby-folder/ -c nginx.conf.
worker_processes 1;
pid nginx.pid;
error_log error.log;

events { worker_connections 1024; }

http {
    log_format project_lb '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';
    access_log access.log project_lb;

    upstream team1_backends {
        server 10.7.17.47:3001 max_fails=1 fail_timeout=10s;
        server 10.7.2.240:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;
        ssl_certificate tls.pem;
        ssl_certificate_key tls.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Edge edge-standby always;
        add_header X-Upstream-Addr $upstream_addr always;

        location / {
            proxy_pass http://team1_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
